{{define "component/rule"}}
<div class="ui large rule modal transition hidden">
    <div class="header">{{tr "AddNotificationRule"}}</div>
    <div class="content">
        <form id="ruleForm" class="ui form">
            <input type="hidden" name="ID">
            <div class="field">
                <label>{{tr "Name"}}</label>
                <input type="text" name="Name">
            </div>
            <div class="field">
                <label>{{tr "Rules"}}</label>
                <div class="ui top attached tabular menu rule-editor-menu">
                    <a class="item active" data-tab="re-visual">{{tr "VisualEditor"}}</a>
                    <a class="item" data-tab="re-raw">{{tr "RawJSON"}}</a>
                </div>
                <div class="ui bottom attached tab segment active" data-tab="re-visual">
                    <div id="ruleList" class="rule-list"></div>
                    <button type="button" class="ui primary mini button" id="addRuleBtn">
                        <i class="add icon"></i> {{tr "AddRule"}}
                    </button>
                </div>
                <div class="ui bottom attached tab segment" data-tab="re-raw">
                    <textarea name="RulesRaw" rows="10" placeholder="[]"></textarea>
                </div>
            </div>
            <div class="field">
                <label>{{tr "NotificationMethodGroup"}}</label>
                <input type="text" name="NotificationTag" placeholder="default">
            </div>
            <div class="field">
                <label>{{tr "NotificationTriggerMode"}}</label>
                <select name="TriggerMode" class="ui fluid dropdown">
                    <option value="0">{{tr "ModeAlwaysTrigger"}}</option>
                    <option value="1">{{tr "ModeOnetimeTrigger"}}</option>
                </select>
            </div>
            <div class="field">
                <label>{{tr "FailTriggerTasks"}}</label>
                <div class="ui fluid multiple tasks search selection dropdown">
                    <input type="hidden" name="FailTriggerTasksRaw">
                    <i class="dropdown icon 1"></i>
                    <div class="default text">{{tr "EnterIdAndNameToSearch"}}</div>
                    <div class="menu"></div>
                </div>
            </div>
            <div class="field">
                <label>{{tr "RecoverTriggerTasks"}}</label>
                <div class="ui fluid multiple tasks search selection dropdown">
                    <input type="hidden" name="RecoverTriggerTasksRaw">
                    <i class="dropdown icon 2"></i>
                    <div class="default text">{{tr "EnterIdAndNameToSearch"}}</div>
                    <div class="menu"></div>
                </div>
            </div>

            <div class="field">
                <div class="ui rule-enable checkbox">
                    <input name="Enable" type="checkbox" tabindex="0" class="hidden">
                    <label>{{tr "Enable"}}</label>
                </div>
            </div>
        </form>
    </div>
    <div class="actions">
        <div class="ui negative button">{{tr "Cancel"}}</div>
        <button class="ui positive nezha-primary-btn right labeled icon button">{{tr "Confirm"}}<i class="checkmark icon"></i>
        </button>
    </div>
</div>
<script>
(function () {
    const ruleEditor = {
        ruleTypes: [
            { value: 'cpu', text: '{{tr "RuleTypeCpu"}}' },
            { value: 'memory', text: '{{tr "RuleTypeMemory"}}' },
            { value: 'swap', text: '{{tr "RuleTypeSwap"}}' },
            { value: 'disk', text: '{{tr "RuleTypeDisk"}}' },
            { value: 'net_in_speed', text: '{{tr "RuleTypeNetInSpeed"}}' },
            { value: 'net_out_speed', text: '{{tr "RuleTypeNetOutSpeed"}}' },
            { value: 'net_all_speed', text: '{{tr "RuleTypeNetAllSpeed"}}' },
            { value: 'transfer_in', text: '{{tr "RuleTypeTransferIn"}}' },
            { value: 'transfer_out', text: '{{tr "RuleTypeTransferOut"}}' },
            { value: 'transfer_all', text: '{{tr "RuleTypeTransferAll"}}' },
            { value: 'transfer_in_cycle', text: '{{tr "RuleTypeTransferInCycle"}}' },
            { value: 'transfer_out_cycle', text: '{{tr "RuleTypeTransferOutCycle"}}' },
            { value: 'transfer_all_cycle', text: '{{tr "RuleTypeTransferAllCycle"}}' },
            { value: 'offline', text: '{{tr "RuleTypeOffline"}}' },
            { value: 'load1', text: '{{tr "RuleTypeLoad1"}}' },
            { value: 'load5', text: '{{tr "RuleTypeLoad5"}}' },
            { value: 'load15', text: '{{tr "RuleTypeLoad15"}}' },
            { value: 'tcp_conn_count', text: '{{tr "RuleTypeTcpConnCount"}}' },
            { value: 'udp_conn_count', text: '{{tr "RuleTypeUdpConnCount"}}' },
            { value: 'process_count', text: '{{tr "RuleTypeProcessCount"}}' },
            { value: 'temperature_max', text: '{{tr "RuleTypeTemperatureMax"}}' },
        ],
        cycleUnits: [
            { value: 'hour', text: '{{tr "CycleUnitHour"}}' },
            { value: 'day', text: '{{tr "CycleUnitDay"}}' },
            { value: 'week', text: '{{tr "CycleUnitWeek"}}' },
            { value: 'month', text: '{{tr "CycleUnitMonth"}}' },
            { value: 'year', text: '{{tr "CycleUnitYear"}}' },
        ],

        getRawTextarea() {
            return document.querySelector('#ruleForm textarea[name="RulesRaw"]');
        },

        isCycleType(type) {
            return type && type.endsWith('_cycle');
        },

        localToRFC3339(localValue) {
            if (!localValue) return null;
            const d = new Date(localValue);
            if (isNaN(d.getTime())) return null;
            const pad = n => n.toString().padStart(2, '0');
            const tzOffset = -d.getTimezoneOffset();
            const tzHours = pad(Math.floor(Math.abs(tzOffset) / 60));
            const tzMinutes = pad(Math.abs(tzOffset) % 60);
            const tzSign = tzOffset >= 0 ? '+' : '-';
            return localValue + ':00' + tzSign + tzHours + ':' + tzMinutes;
        },

        rfc3339ToLocal(rfc) {
            if (!rfc) return '';
            const d = new Date(rfc);
            if (isNaN(d.getTime())) return '';
            const pad = n => n.toString().padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        },

        buildRuleHTML(index) {
            const typeOptions = this.ruleTypes.map(t => `<option value="${t.value}">${t.text}</option>`).join('');
            const unitOptions = this.cycleUnits.map(u => `<option value="${u.value}">${u.text}</option>`).join('');
            return `
                <div class="ui segment rule-item" data-index="${index}">
                    <div class="ui grid">
                        <div class="sixteen wide column">
                            <h5 class="ui header">{{tr "Rule"}} #${index + 1}</h5>
                        </div>
                        <div class="eight wide column">
                            <div class="field">
                                <label>{{tr "RuleType"}}</label>
                                <select class="rule-type ui fluid dropdown">${typeOptions}</select>
                            </div>
                        </div>
                        <div class="four wide column">
                            <div class="field">
                                <label>{{tr "MinThreshold"}}</label>
                                <input type="number" class="rule-min" step="any" placeholder="0">
                            </div>
                        </div>
                        <div class="four wide column">
                            <div class="field">
                                <label>{{tr "MaxThreshold"}}</label>
                                <input type="number" class="rule-max" step="any" placeholder="90">
                            </div>
                        </div>
                        <div class="sixteen wide column rule-duration-row">
                            <div class="field">
                                <label>{{tr "Duration"}} ({{tr "Seconds"}}, &gt;=3)</label>
                                <input type="number" class="rule-duration" min="3" placeholder="60">
                            </div>
                        </div>
                        <div class="sixteen wide column rule-cycle-row" style="display:none;">
                            <div class="three fields">
                                <div class="field">
                                    <label>{{tr "CycleStart"}}</label>
                                    <input type="datetime-local" class="rule-cycle-start">
                                </div>
                                <div class="field">
                                    <label>{{tr "CycleInterval"}}</label>
                                    <input type="number" class="rule-cycle-interval" min="1" placeholder="1">
                                </div>
                                <div class="field">
                                    <label>{{tr "CycleUnit"}}</label>
                                    <select class="rule-cycle-unit ui fluid dropdown">${unitOptions}</select>
                                </div>
                            </div>
                        </div>
                        <div class="eight wide column">
                            <div class="field">
                                <label>{{tr "Coverage"}}</label>
                                <select class="rule-cover ui fluid dropdown">
                                    <option value="0">{{tr "AllIncludedOnlySpecificServersAreNotAlerted"}}</option>
                                    <option value="1">{{tr "IgnoreAllOnlyAlertSpecificServers"}}</option>
                                </select>
                            </div>
                        </div>
                        <div class="sixteen wide column">
                            <div class="field">
                                <label>{{tr "SpecificServers"}}</label>
                                <div class="ui fluid multiple servers search selection dropdown rule-servers">
                                    <input type="hidden" class="rule-ignore-raw">
                                    <i class="dropdown icon"></i>
                                    <div class="default text">{{tr "EnterIdAndNameToSearch"}}</div>
                                    <div class="menu"></div>
                                </div>
                            </div>
                        </div>
                        <div class="sixteen wide column right aligned">
                            <button type="button" class="ui negative mini button remove-rule"><i class="trash icon"></i> {{tr "RemoveRule"}}</button>
                        </div>
                    </div>
                </div>
            `;
        },

        updateRuleVisibility(item) {
            const type = item.find('.rule-type').val();
            const isCycle = this.isCycleType(type);
            item.find('.rule-duration-row').toggle(!isCycle);
            item.find('.rule-cycle-row').toggle(isCycle);
        },

        getServerIdsFromItem(item) {
            const raw = item.find('.rule-ignore-raw').val();
            if (!raw) return [];
            return [...raw.matchAll(/\d+/g)].map(m => parseInt(m[0]));
        },

        setServerIdsForItem(item, ids) {
            const dropdown = item.find('.rule-servers');
            const hidden = dropdown.find('input.rule-ignore-raw');
            hidden.val(ids.join(','));
            dropdown.find('a.ui.label.visible').remove();
            const icon = dropdown.find('i.dropdown.icon');
            ids.forEach(id => {
                icon.after(`<a class="ui label transition visible" data-value="${id}" style="display: inline-block !important;">ID:${id}<i class="delete icon"></i></a>`);
            });
        },

        addRule(ruleData) {
            const list = document.getElementById('ruleList');
            const index = list.children.length;
            const html = this.buildRuleHTML(index);
            const item = $(html);
            $('#ruleList').append(item);

            item.find('.rule-type, .rule-cover, .rule-cycle-unit').dropdown();
            item.find('.rule-servers').dropdown({
                clearable: true,
                apiSettings: {
                    url: '/api/search-server?word={query}',
                    cache: false,
                }
            });
            item.find('.rule-ignore-raw').on('change', () => {
                this.syncToRaw();
            });

            item.find('.rule-type').on('change', () => {
                this.updateRuleVisibility(item);
                this.syncToRaw();
            });
            item.find('input, select').on('input change', () => {
                this.syncToRaw();
            });
            item.find('.remove-rule').on('click', () => {
                item.remove();
                this.renumberRules();
                this.syncToRaw();
            });

            if (ruleData) {
                item.find('.rule-type').dropdown('set selected', ruleData.type || 'cpu');
                item.find('.rule-min').val(ruleData.min !== undefined ? ruleData.min : '');
                item.find('.rule-max').val(ruleData.max !== undefined ? ruleData.max : '');
                item.find('.rule-duration').val(ruleData.duration !== undefined ? ruleData.duration : '');
                item.find('.rule-cover').dropdown('set selected', (ruleData.cover !== undefined ? ruleData.cover : 0).toString());
                if (this.isCycleType(ruleData.type)) {
                    item.find('.rule-cycle-start').val(this.rfc3339ToLocal(ruleData.cycle_start));
                    item.find('.rule-cycle-interval').val(ruleData.cycle_interval !== undefined ? ruleData.cycle_interval : '');
                    item.find('.rule-cycle-unit').dropdown('set selected', ruleData.cycle_unit || 'hour');
                }
                const ignoreIds = [];
                if (ruleData.ignore) {
                    Object.keys(ruleData.ignore).forEach(k => {
                        if (ruleData.ignore[k]) ignoreIds.push(parseInt(k));
                    });
                }
                this.setServerIdsForItem(item, ignoreIds);
            }

            this.updateRuleVisibility(item);
            item.find('.rule-servers').dropdown('refresh');
        },

        renumberRules() {
            $('#ruleList .rule-item').each((i, el) => {
                $(el).find('.ui.header').text('{{tr "Rule"}} #' + (i + 1));
            });
        },

        buildRules() {
            const rules = [];
            $('#ruleList .rule-item').each((i, el) => {
                const item = $(el);
                const type = item.find('.rule-type').val();
                const rule = { type: type };
                const min = item.find('.rule-min').val();
                const max = item.find('.rule-max').val();
                if (min !== '') rule.min = parseFloat(min);
                if (max !== '') rule.max = parseFloat(max);

                if (this.isCycleType(type)) {
                    const cycleStart = this.localToRFC3339(item.find('.rule-cycle-start').val());
                    if (cycleStart) rule.cycle_start = cycleStart;
                    const cycleInterval = item.find('.rule-cycle-interval').val();
                    if (cycleInterval !== '') rule.cycle_interval = parseInt(cycleInterval);
                    rule.cycle_unit = item.find('.rule-cycle-unit').val() || 'hour';
                } else {
                    const duration = item.find('.rule-duration').val();
                    if (duration !== '') rule.duration = parseInt(duration);
                }

                rule.cover = parseInt(item.find('.rule-cover').val() || '0');
                const ignoreIds = this.getServerIdsFromItem(item);
                if (ignoreIds.length) {
                    rule.ignore = {};
                    ignoreIds.forEach(id => rule.ignore[id] = true);
                }
                rules.push(rule);
            });
            return rules;
        },

        syncToRaw() {
            const rules = this.buildRules();
            this.getRawTextarea().value = JSON.stringify(rules, null, 2);
        },

        loadFromRaw() {
            const raw = this.getRawTextarea().value.trim();
            let rules = [];
            if (raw) {
                try {
                    rules = JSON.parse(raw);
                    if (!Array.isArray(rules)) rules = [];
                } catch (e) {
                    rules = [];
                }
            }
            $('#ruleList').empty();
            if (rules.length === 0) {
                this.addRule();
            } else {
                rules.forEach(rule => this.addRule(rule));
            }
            this.syncToRaw();
        },

        validateRaw() {
            const raw = this.getRawTextarea().value.trim();
            if (!raw) return true;
            try {
                JSON.parse(raw);
                return true;
            } catch (e) {
                alert('{{tr "PleaseEnterValidJSON"}}');
                return false;
            }
        },

        init() {
            const self = this;
            $('.rule-editor-menu .item').tab({
                onVisible: function (tabPath) {
                    if (tabPath === 're-raw') {
                        self.syncToRaw();
                    } else {
                        if (self.validateRaw()) {
                            self.loadFromRaw();
                        }
                    }
                }
            });

            $('#addRuleBtn').on('click', () => {
                this.addRule();
                this.syncToRaw();
            });
        }
    };

    window.ruleEditor = ruleEditor;
})();
</script>
{{end}}
