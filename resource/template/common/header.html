{{define "common/header"}}
<!DOCTYPE html>
<html lang="{{.Conf.Language}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta content="telephone=no" name="format-detection">
    <title>{{.Title}}</title>
    <link rel="shortcut icon" type="image/png" href="/static/logo.svg?v20210804" />
    {{if .IsDashboardPage}}
    <link rel="stylesheet" type="text/css" href="/static/vendor/element-plus/index.css?v20260617">
    <link rel="stylesheet" type="text/css" href="/static/vendor/element-plus/dark.css?v20260617">
    <link rel="stylesheet" type="text/css" href="/static/vendor/remixicon/fonts/remixicon.css?v20260617">
    <link rel="stylesheet" type="text/css" href="/static/dashboard.css?v20260617-layout22">
    {{else}}
    <link rel="stylesheet" type="text/css" href="/static/unpkg/semantic-ui@2.4.0/dist/semantic.min.css">
    <link rel="stylesheet" type="text/css" href="/static/unpkg/font-logos@0.17.0/assets/font-logos.css">
    <link rel="stylesheet" type="text/css" href="/static/semantic-ui-alerts.min.css">
    <link rel="stylesheet" type="text/css" href="/static/main.css?v20260617-pn1">
    {{end}}
    <link rel="stylesheet" type="text/css" href="/static/darkmode.css?v20260617">
    <script>
        (function () {
            var storageKey = "santaizi-dashboard-theme";
            var dashboardPage = {{if .IsDashboardPage}}true{{else}}false{{end}};
            var mediaQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
            var currentMode = "auto";

            function systemTheme() {
                return mediaQuery && mediaQuery.matches ? "dark" : "light";
            }

            function storedMode() {
                try {
                    var mode = localStorage.getItem(storageKey);
                    return mode === "auto" || mode === "light" || mode === "dark" ? mode : "auto";
                } catch (error) {
                    return "auto";
                }
            }

            function applyEffective(theme) {
                document.documentElement.setAttribute("nz-theme", theme);
                document.documentElement.style.colorScheme = theme;
            }

            function updateThemeMenu() {
                var mode = currentMode;
                document.querySelectorAll(".dashboard-theme-menu-item").forEach(function (btn) {
                    btn.classList.toggle("active", btn.getAttribute("data-mode") === mode);
                });
            }

            function applyMode(mode, persist) {
                currentMode = mode;
                applyEffective(mode === "auto" ? systemTheme() : mode);
                if (persist) {
                    try {
                        localStorage.setItem(storageKey, mode);
                    } catch (error) {}
                }
                updateThemeMenu();
            }

            window.setDashboardTheme = function (mode) {
                if (mode === "auto" || mode === "light" || mode === "dark") {
                    applyMode(mode, true);
                }
            };

            window.cycleDashboardTheme = function () {
                var modes = ["auto", "light", "dark"];
                var next = modes[(modes.indexOf(currentMode) + 1) % modes.length];
                applyMode(next, true);
            };

            if (dashboardPage) {
                currentMode = storedMode();
                applyMode(currentMode, false);

                if (mediaQuery && mediaQuery.addEventListener) {
                    mediaQuery.addEventListener("change", function (event) {
                        if (currentMode === "auto") {
                            applyEffective(event.matches ? "dark" : "light");
                        }
                    });
                }
            } else {
                applyEffective(systemTheme());
            }

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", updateThemeMenu);
            } else {
                updateThemeMenu();
            }
        })();
    </script>
</head>
{{if ts .CustomCodeDashboard}} {{.CustomCodeDashboard|safe}} {{end}}
<body class="{{if .IsDashboardPage}}dashboard-layout{{if not .IsAdminPage}} dashboard-auth-layout{{end}}{{end}}">
{{if and .IsDashboardPage (not .IsAdminPage)}}
<button class="dashboard-floating-theme-toggle" type="button" onclick="cycleDashboardTheme()" aria-label="{{tr "Theme"}}">
    <i class="ri-moon-line dashboard-theme-dark-icon"></i>
    <i class="ri-sun-line dashboard-theme-light-icon"></i>
</button>
{{end}}
{{end}}
