{{define "dashboard-default/setting"}}
{{template "common/header" .}}
{{template "common/menu" .}}
<main class="dashboard-page dashboard-page-narrow">
    <div class="dashboard-page-header">
        <div>
            <h1>{{tr "Settings"}}</h1>
            <p>{{tr "DashboardTheme"}}</p>
        </div>
    </div>
    <form id="settingForm" class="dashboard-form dashboard-form-panel" onsubmit="return submitSettingForm(event);">
        <label>
            <span>{{tr "SiteTitle"}}</span>
            <input type="text" name="Title" placeholder="{{tr "NezhaMonitoring"}}" value="{{.Conf.Site.Brand}}">
        </label>
        <label>
            <span>{{tr "AdministratorList"}}</span>
            <input type="text" name="Admin" placeholder="1010,2020" value="{{.Conf.Oauth2.Admin}}">
        </label>
        <label>
            <span>{{tr "Theme"}}</span>
            <select name="Theme">
                {{range $k,$v := .Themes}}
                <option value="{{$k}}" {{if eq $.Conf.Site.Theme $k }}selected{{end}}>{{$v}}</option>
                {{end}}
            </select>
        </label>
        <label>
            <span>{{tr "DashboardTheme"}}</span>
            <select name="DashboardTheme">
                {{range $k,$v := .DashboardThemes}}
                <option value="{{$k}}" {{if eq $.Conf.Site.DashboardTheme $k }}selected{{end}}>{{$v}}</option>
                {{end}}
            </select>
        </label>
        <label>
            <span>Language</span>
            <select name="Language">
                {{range $k,$v := .Languages}}
                <option value="{{$k}}" {{if eq $.Conf.Language $k }}selected{{end}}>{{$v}}</option>
                {{end}}
            </select>
        </label>
        <label>
            <span>{{tr "CustomCodes"}}</span>
            <textarea name="CustomCode" rows="5">{{.Conf.Site.CustomCode}}</textarea>
        </label>
        <label>
            <span>{{tr "CustomCodesDashboard"}}</span>
            <textarea name="CustomCodeDashboard" rows="5">{{.Conf.Site.CustomCodeDashboard}}</textarea>
        </label>
        <label>
            <span>{{tr "AccessPassword"}}</span>
            <input type="text" name="ViewPassword" value="{{.Conf.Site.ViewPassword}}">
        </label>
        <label>
            <span>{{tr "PanelServerDomainAndIP"}}</span>
            <input type="text" name="GRPCHost" value="{{.Conf.GRPCHost}}">
        </label>
        <label>
            <span>{{tr "CustomNameservers"}}</span>
            <input type="text" name="CustomNameservers" value="{{.Conf.DNSServers}}">
        </label>
        <fieldset class="dashboard-fieldset">
            <legend>{{tr "IPChangeAlert"}}</legend>
            <label>
                <span>{{tr "Coverage"}}</span>
                <select name="Cover">
                    <option value="0" {{if eq .Conf.Cover 0}}selected{{end}}>{{tr "AllIncludedOnlySpecificServersAreNotAlerted"}}</option>
                    <option value="1" {{if eq .Conf.Cover 1}}selected{{end}}>{{tr "IgnoreAllOnlyAlertSpecificServers"}}</option>
                </select>
            </label>
            <label>
                <span>{{tr "SpecificServers"}}</span>
                <input type="text" name="IgnoredIPNotification" placeholder="{{tr "ServerIDSeparatedByCommas"}} 1001,1002,1003" value="{{.Conf.IgnoredIPNotification}}">
            </label>
            <label>
                <span>{{tr "IPChangeNotificationTag"}}</span>
                <input type="text" name="IPChangeNotificationTag" value="{{.Conf.IPChangeNotificationTag}}">
            </label>
            <label class="dashboard-checkbox">
                <input name="EnableIPChangeNotification" type="checkbox" {{if .Conf.EnableIPChangeNotification}}checked{{end}}>
                <span>{{tr "Enable"}}</span>
            </label>
        </fieldset>
        <label class="dashboard-checkbox">
            <input name="EnablePlainIPInNotification" type="checkbox" {{if .Conf.EnablePlainIPInNotification}}checked{{end}}>
            <span>{{tr "NotificationMessagesDoNotHideIP"}}</span>
        </label>
        <label class="dashboard-checkbox">
            <input name="DisableSwitchTemplateInFrontend" type="checkbox" {{if .Conf.DisableSwitchTemplateInFrontend}}checked{{end}}>
            <span>{{tr "DisableSwitchTemplateInFrontend"}}</span>
        </label>
        <div class="dashboard-form-actions">
            <button class="dashboard-button dashboard-button-primary" type="submit"><i class="ri-save-3-line"></i>{{tr "Save"}}</button>
        </div>
    </form>
</main>
{{template "common/footer" .}}
{{end}}
