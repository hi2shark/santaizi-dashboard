{{define "dashboard-default/file"}}
<!DOCTYPE html>
<html lang="{{.Conf.Language}}">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File List</title>
    <link rel="shortcut icon" type="image/png" href="/static/logo.svg?v20210804" />
    <link rel="stylesheet" type="text/css" href="/static/vendor/remixicon/fonts/remixicon.css" />
</head>
<style>
    :root {
        --file-bg: #f5f7fb;
        --file-surface: #ffffff;
        --file-border: #d9e2ef;
        --file-text: #172033;
        --file-muted: #65748b;
        --file-primary: #12599a;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: var(--file-bg);
        color: var(--file-text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .file-list {
        list-style-type: none;
        padding: 10px;
        margin: 0;
    }

    .file-item {
        margin: 8px 0;
        border: 1px solid var(--file-border);
        border-radius: 8px;
        background: var(--file-surface);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        min-height: 44px;
        padding: 8px 10px;
    }

    .file-item-main {
        min-width: 0;
        flex: 1;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
    }

    .file-item-main span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .file-item-main i {
        color: var(--file-primary);
        font-size: 20px;
    }

    button.file-item-main,
    .file-action-button {
        cursor: pointer;
    }

    #top-app-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        gap: 10px;
        border-bottom: 1px solid var(--file-border);
        background: var(--file-surface);
    }

    .file-toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    #current-directory {
        font-size: 1rem;
        font-weight: normal;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
        text-align: center;
        font-family: "SFMono-Regular", Consolas, monospace;
        color: var(--file-muted);
    }

    .file-action-button {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--file-border);
        border-radius: 7px;
        background: var(--file-surface);
        color: var(--file-text);
        font-size: 18px;
    }

    .file-action-button:hover {
        border-color: var(--file-primary);
        color: var(--file-primary);
    }

    .file-dialog {
        width: min(92vw, 420px);
        border: 1px solid var(--file-border);
        border-radius: 8px;
        color: var(--file-text);
        background: var(--file-surface);
    }

    .file-dialog::backdrop {
        background: rgba(15, 23, 42, 0.32);
    }

    .file-dialog h2 {
        margin: 0 0 14px;
        font-size: 18px;
    }

    .file-dialog input {
        width: 100%;
        min-height: 38px;
        padding: 8px 10px;
        border: 1px solid var(--file-border);
        border-radius: 7px;
        font: inherit;
    }

    .file-dialog-actions {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
    }

    .file-text-button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--file-border);
        border-radius: 7px;
        background: var(--file-surface);
        color: var(--file-text);
        font: inherit;
        cursor: pointer;
    }

    .file-text-button.primary {
        border-color: var(--file-primary);
        background: var(--file-primary);
        color: #fff;
    }

    #upd-progress {
        width: 100%;
    }
</style>

<body>
    <div id="top-app-bar">
        <div class="file-toolbar">
            <button class="file-action-button" id="refresh" type="button" title="{{tr "Refresh"}}"><i class="ri-refresh-line"></i></button>
            <button class="file-action-button" id="copy" type="button" title="{{tr "CopyPath"}}"><i class="ri-file-copy-line"></i></button>
            <button class="file-action-button" id="goto" type="button" title="{{tr "Goto"}}"><i class="ri-folder-open-line"></i></button>
        </div>
        <span id="current-directory"></span>
        <button class="file-action-button" id="upload" type="button" title="Upload"><i class="ri-upload-cloud-2-line"></i></button>
    </div>

    <ul id="file-list" class="file-list"></ul>

    <dialog id="error-dialog" class="file-dialog">
        <h2>Error</h2>
        <p>{{tr "FMError"}}</p>
        <div class="file-dialog-actions">
            <button class="file-text-button primary" id="error-close" type="button">{{tr "Confirm"}}</button>
        </div>
    </dialog>

    <dialog id="upd-modal" class="file-dialog">
        <h2 id="upd-title">Working...</h2>
        <progress id="upd-progress"></progress>
    </dialog>

    <dialog id="goto-dialog" class="file-dialog">
        <h2>{{tr "GotoHeadline"}}</h2>
        <input id="goto-text" value="">
        <div class="file-dialog-actions">
            <button class="file-text-button" id="goto-close" type="button">{{tr "GotoClose"}}</button>
            <button class="file-text-button primary" id="goto-go" type="button">{{tr "GotoGo"}}</button>
        </div>
    </dialog>

    <script>
        let currentPath = '/opt/santaizi/';
        let fileName = '';
        let receivedBuffer = []; // 用于缓存数据块
        let expectedLength = 0;
        let receivedLength = 0;
        let isFirstChunk = true;
        let isUpCompleted = false;
        let handleReady = false;
        let worker;

        function updateDirectoryTitle() {
            const directoryTitle = document.getElementById('current-directory');
            directoryTitle.textContent = `${currentPath}`;
        }

        function openDialog(dialog) {
            if (dialog.showModal && !dialog.open) {
                dialog.showModal();
            } else {
                dialog.open = true;
            }
        }

        function closeDialog(dialog) {
            if (dialog.close && dialog.open) {
                dialog.close();
            } else {
                dialog.open = false;
            }
        }

        function appendFileIcon(parent, iconClass) {
            const icon = document.createElement('i');
            icon.className = iconClass;
            parent.appendChild(icon);
        }

        function appendFileName(parent, name) {
            const label = document.createElement('span');
            label.textContent = name;
            parent.appendChild(label);
        }

        function updateFileList(items) {
            const fileListElement = document.getElementById('file-list');
            fileListElement.innerHTML = '';

            if (currentPath !== '/') {
                const upItem = document.createElement('li');
                upItem.className = 'file-item up-directory';
                const upButton = document.createElement('button');
                upButton.className = 'file-item-main';
                upButton.type = 'button';
                appendFileIcon(upButton, 'ri-arrow-left-up-line');
                appendFileName(upButton, '..');
                upButton.onclick = function () {
                    const lastSlashIndex = currentPath.lastIndexOf('/', currentPath.length - 2);
                    currentPath = currentPath.substring(0, lastSlashIndex + 1) || '/';
                    listFile();
                };
                upItem.appendChild(upButton);
                fileListElement.appendChild(upItem);
            }

            items.sort((a, b) => {
                if (a.fileType === 'dir' && b.fileType !== 'dir') {
                    return -1;
                }
                if (a.fileType !== 'dir' && b.fileType === 'dir') {
                    return 1;
                }
                return a.name.localeCompare(b.name);
            });

            items.forEach(item => {
                const listItem = document.createElement('li');
                listItem.className = `file-item ${item.fileType.toLowerCase()}`;
                const main = document.createElement(item.fileType === 'dir' ? 'button' : 'div');
                main.className = 'file-item-main';
                if (item.fileType === 'dir') {
                    main.type = 'button';
                    appendFileIcon(main, 'ri-folder-3-line');
                } else {
                    appendFileIcon(main, 'ri-file-line');
                }
                appendFileName(main, item.name);
                listItem.appendChild(main);

                if (item.fileType === 'dir') {
                    main.onclick = function () {
                        currentPath += `${item.name}/`;
                        listFile();
                    };
                } else {
                    const downloadButton = document.createElement('button');
                    downloadButton.className = 'file-action-button';
                    downloadButton.type = 'button';
                    downloadButton.title = 'Download';
                    downloadButton.innerHTML = '<i class="ri-download-cloud-2-line"></i>';
                    downloadButton.onclick = function () {
                        const filePath = currentPath + item.name;
                        fileName = item.name;
                        downloadFile(filePath);
                    };
                    listItem.appendChild(downloadButton);
                }

                fileListElement.appendChild(listItem);
            });
            updateDirectoryTitle();
        }

        function resetUpdState() {
            receivedBuffer = [];
            expectedLength = 0;
            receivedLength = 0;
            isFirstChunk = true;
        }

        function downloadFile(filePath) {
            showUpdModal('d');

            const prefix = new Int8Array([1]); // Request download
            const filePathMessage = new TextEncoder().encode(filePath);

            const msg = new Int8Array(prefix.length + filePathMessage.length);
            msg.set(prefix);
            msg.set(filePathMessage, prefix.length);

            socket.send(msg);
        }

        function listFile() {
            const prefix = new Int8Array([0]);
            const resizeMessage = new TextEncoder().encode(currentPath);

            const msg = new Int8Array(prefix.length + resizeMessage.length);
            msg.set(prefix);
            msg.set(resizeMessage, prefix.length);

            socket.send(msg);
        }

        async function uploadFile(file) {
            showUpdModal('u');

            const chunkSize = 1048576; // 1MB chunk
            let offset = 0;

            const filePath = `${currentPath}${file.name}`;
            const fileSize = file.size;
            const messageType = 2;

            // Build header (type + file size + path)
            const filePathBytes = new TextEncoder().encode(filePath);
            const header = new ArrayBuffer(1 + 8 + filePathBytes.length);
            const headerView = new DataView(header);

            headerView.setUint8(0, messageType);
            headerView.setBigUint64(1, BigInt(fileSize), false);

            new Uint8Array(header, 9).set(filePathBytes);

            // Send header
            socket.send(header);

            // Send data chunks
            while (offset < fileSize) {
                const chunk = file.slice(offset, offset + chunkSize);
                const arrayBuffer = await readFileAsArrayBuffer(chunk);
                socket.send(arrayBuffer);
                offset += chunkSize;
            }

            const checkCompletion = setInterval(() => {
                if (isUpCompleted) {
                    clearInterval(checkCompletion);
                    hideUpdModal();
                    resetUpdState();
                    listFile();
                }
            }, 100);
        }

        async function parseFileList(arrayBuffer) {
            const dataView = new DataView(arrayBuffer);
            const items = [];
            let offset = 4;

            const pathLength = dataView.getUint32(offset);
            offset += 4;

            const pathArray = new Uint8Array(arrayBuffer, offset, pathLength);
            currentPath = new TextDecoder('utf-8').decode(pathArray);
            offset += pathLength;

            while (offset < dataView.byteLength) {
                const fileType = dataView.getUint8(offset);
                offset += 1;

                const nameLength = dataView.getUint8(offset);
                offset += 1;

                if (offset + nameLength > dataView.byteLength) {
                    console.error('Error: Name length exceeds buffer size');
                    break;
                }

                const nameArray = new Uint8Array(arrayBuffer, offset, nameLength);
                const name = new TextDecoder('utf-8').decode(nameArray);
                offset += nameLength;

                items.push({
                    fileType: fileType === 0x01 ? 'dir' : 'f',
                    name: name,
                });
            }

            return { items };
        }

        function readFileAsArrayBuffer(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsArrayBuffer(blob);
            });
        }

        function concatenateArrayBuffers(buffers) {
            let totalLength = 0;
            buffers.forEach(buf => totalLength += buf.byteLength);

            const result = new Uint8Array(totalLength);
            let offset = 0;
            buffers.forEach(buf => {
                result.set(new Uint8Array(buf), offset);
                offset += buf.byteLength;
            });

            return result.buffer;
        }

        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }

        async function copyTextToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (err) {
                console.error('Failed to copy text to clipboard: ', err);
            }
        }

        async function handleError(errMsg) {
            try {
                console.error('Received error: ', errMsg);
                hideUpdModal();
                const errorDialog = document.getElementById('error-dialog');
                openDialog(errorDialog);
                if (socket.readyState === WebSocket.OPEN) {
                    socket.close(1000, 'Closing due to error');
                }
            } catch (error) {
                console.error('Error while handling error and closing WebSocket:', error);
            }
        }

        function showUpdModal(operation) {
            const modal = document.getElementById('upd-modal');
            const title = document.getElementById('upd-title');
            if (operation === 'd') {
                title.textContent = 'Downloading...';
            } else if (operation === 'u') {
                title.textContent = 'Uploading...';
            }
            openDialog(modal);
        }

        function hideUpdModal() {
            const modal = document.getElementById('upd-modal');
            closeDialog(modal);
        }

        function waitForHandleReady() {
            return new Promise(resolve => {
                const checkReady = () => {
                    if (handleReady) {
                        resolve();
                    } else {
                        setTimeout(checkReady, 10);
                    }
                };
                checkReady();
            });
        }

        const socket = new WebSocket((window.location.protocol === 'https:' ? 'wss' : 'ws') + '://' + window.location.host + '/file/' + '{{.SessionID}}');
        socket.binaryType = 'arraybuffer';

        socket.onmessage = async function (event) {
            try {
                const arrayBuffer = event.data;

                if (isFirstChunk) {
                    const identifier = new Uint8Array(arrayBuffer, 0, 4);
                    const fileIdentifier = new Uint8Array([0x4E, 0x5A, 0x54, 0x44]); // NZTD
                    const fileNameIdentifier = new Uint8Array([0x4E, 0x5A, 0x46, 0x4E]); // NZFN
                    const errorIdentifier = new Uint8Array([0x4E, 0x45, 0x52, 0x52]); // NERR
                    const completeIdentifier = new Uint8Array([0x4E, 0x5A, 0x55, 0x50]); // NZUP

                    if (arraysEqual(identifier, fileIdentifier)) {
                        worker = new Worker('/static/file.js');
                        worker.onmessage = async function (event) {
                            switch (event.data.type) {
                                case 'error':
                                    console.error('Error from worker:', event.data.error);
                                    break;
                                case 'progress':
                                    handleReady = true;
                                    break;
                                case 'result':
                                    handleReady = false;
                                    const url = URL.createObjectURL(event.data.blob);
                                    const anchor = document.createElement('a');
                                    anchor.href = url;
                                    anchor.download = event.data.fileName;
                                    anchor.click();
                                    URL.revokeObjectURL(url);

                                    // Delete the file in OPFS
                                    window.addEventListener('beforeunload', async () => {
                                        await worker.postMessage({ operation: 3, arrayBuffer: null, fileName: event.data.fileName });
                                    });

                                    hideUpdModal();
                                    resetUpdState();
                                    break;
                            }
                        };
                        await worker.postMessage({ operation: 1, arrayBuffer: arrayBuffer, fileName: fileName });
                        isFirstChunk = false;
                    } else if (arraysEqual(identifier, fileNameIdentifier)) {
                        // List files
                        const { items } = await parseFileList(arrayBuffer);
                        updateFileList(items);
                        return;
                    } else if (arraysEqual(identifier, errorIdentifier)) {
                        // Handle error
                        const errBytes = arrayBuffer.slice(4);
                        const errMsg = new TextDecoder('utf-8').decode(errBytes);
                        await handleError(errMsg);
                        return;
                    } else if (arraysEqual(identifier, completeIdentifier)) {
                        // Upload is completed
                        isUpCompleted = true;
                        return;
                    } else {
                        console.log('Unknown identifier');
                        return;
                    }
                } else {
                    await waitForHandleReady();
                    await worker.postMessage({ operation: 2, arrayBuffer: arrayBuffer, fileName: fileName });
                }
            } catch (error) {
                console.error('Error processing received data:', error);
            }
        };

        socket.onopen = function (event) {
            listFile();
        };

        socket.onerror = function (event) {
            console.error('WebSocket error:', event);
        };

        socket.onclose = function (event) {
            console.log('WebSocket connection closed:', event);
        };

        document.getElementById('refresh').addEventListener('click', listFile);

        document.getElementById('copy').addEventListener('click', async () => {
            await copyTextToClipboard(currentPath);
        });

        document.getElementById('goto').addEventListener('click', function () {
            const dialog = document.getElementById('goto-dialog');
            const textField = document.getElementById('goto-text');
            const goButton = document.getElementById('goto-go');
            const closeButton = document.getElementById('goto-close');

            openDialog(dialog);

            // Ensure the path ends with a separator
            const updateText = function (event) {
                let text = event.target.value;
                if (!text.endsWith('/')) {
                    text += '/';
                }
                return text;
            };

            const handleGoClick = function () {
                let text = updateText({ target: textField });
                currentPath = text;
                listFile();
                closeDialog(dialog);
            };

            textField.removeEventListener('change', updateText);
            textField.addEventListener('change', updateText);

            goButton.removeEventListener('click', handleGoClick);
            goButton.addEventListener('click', handleGoClick);

            closeButton.addEventListener("click", () => closeDialog(dialog));
        });

        document.getElementById('error-close').addEventListener('click', function () {
            closeDialog(document.getElementById('error-dialog'));
        });

        document.getElementById('upload').addEventListener('click', async function () {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.style.display = 'none';

            fileInput.addEventListener('change', async function (event) {
                const file = event.target.files[0];
                if (file) {
                    await uploadFile(file);
                    isUpCompleted = false;
                }
            });

            document.body.appendChild(fileInput);
            fileInput.click();
            document.body.removeChild(fileInput);
        });
    </script>
</body>

</html>
{{end}}
