components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: santaizi-dashboard
      description: 管理员 OAuth 会话 Cookie
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API Token（Authorization: Bearer）'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 浏览器 Cookie 会话写操作必填；值来自 GET /api/v2/auth/session 的 csrf_token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CollectorId:
      name: collectorId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    Sort:
      name: sort
      in: query
      schema:
        type: string
        maxLength: 64
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie 会话写操作时必填；Bearer Token 调用可省略
      schema:
        type: string
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        trace_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Meta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        next_cursor:
          type: string
    Session:
      type: object
      required:
      - authenticated
      - csrf_token
      - login_url
      - capabilities
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
        login_url:
          type: string
        capabilities:
          type: array
          items:
            type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - id
      - login
      - name
      - super_admin
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        super_admin:
          type: boolean
    Bootstrap:
      type: object
      required:
      - brand
      - locale
      - version
      - logo_url
      - requires_view_password
      - view_password_verified
      - show_availability
      - authenticated
      properties:
        brand:
          type: string
        locale:
          type: string
          enum:
          - zh-CN
          - zh-TW
          - en-US
          - es-ES
        version:
          type: string
        csrf_token:
          type: string
        logo_url:
          type: string
        background_url:
          type: string
        footer_text:
          type: string
        primary_color:
          type: string
        custom_css:
          type: string
        requires_view_password:
          type: boolean
        view_password_verified:
          type: boolean
        show_availability:
          type: boolean
        authenticated:
          type: boolean
        theme:
          type: string
          enum:
          - server-status
          - nazhua
        allow_frontend_theme_switch:
          type: boolean
    TelemetryPresentation:
      type: object
      properties:
        host:
          type: string
          enum:
          - online
          - offline
          - unknown
        connectivity:
          type: string
          enum:
          - full
          - partial
          - unavailable
          - unknown
        available:
          type: boolean
          nullable: true
        coverage:
          type: string
    PublicNote:
      type: object
      additionalProperties: true
      properties:
        billingDataMod:
          $ref: '#/components/schemas/PublicNoteBilling'
        planDataMod:
          $ref: '#/components/schemas/PublicNotePlan'
        customData:
          $ref: '#/components/schemas/PublicNotePresentation'
    PublicNoteBilling:
      type: object
      additionalProperties: true
      properties:
        startDate:
          type: string
        endDate:
          type: string
          description: Use 0000-00-00 for an unlimited term.
        autoRenewal:
          type: string
          enum:
          - '0'
          - '1'
        cycle:
          type: string
        amount:
          type: string
    PublicNotePlan:
      type: object
      additionalProperties: true
      properties:
        bandwidth:
          type: string
        trafficVol:
          type: string
        trafficType:
          type: string
        IPv4:
          type: string
          enum:
          - '0'
          - '1'
        IPv6:
          type: string
          enum:
          - '0'
          - '1'
        networkRoute:
          type: string
        extra:
          type: string
    PublicNotePresentation:
      type: object
      additionalProperties: true
      properties:
        location:
          type: string
        flag:
          type: string
        orderLink:
          type: string
        buyBtnText:
