        $ref: '#/components/requestBodies/MonitorWrite'
      responses:
        '200':
          $ref: '#/components/responses/MonitorResponse'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Monitors
      summary: 删除服务监控
      operationId: deleteMonitor
      x-ui-route: /admin/services
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
