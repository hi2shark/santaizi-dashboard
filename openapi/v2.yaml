      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ObjectListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/notifications:
    get:
      tags:
      - Notifications
      summary: 通知渠道列表
      operationId: listNotifications
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      responses:
        '200':
          $ref: '#/components/responses/NotificationChannelListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Notifications
      summary: 创建通知渠道
      operationId: createNotification
      x-ui-route: /admin/notifications
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/NotificationChannelWrite'
      responses:
        '201':
          $ref: '#/components/responses/NotificationChannelResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/notifications/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Notifications
      summary: 通知渠道详情
      operationId: getNotification
      responses:
        '200':
          $ref: '#/components/responses/NotificationChannelResponse'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Notifications
      summary: 更新通知渠道
      operationId: updateNotification
      x-ui-route: /admin/notifications
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/NotificationChannelWrite'
      responses:
        '200':
          $ref: '#/components/responses/NotificationChannelResponse'
