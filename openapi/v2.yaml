        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/notifications/{id}/test:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      tags:
      - Notifications
      summary: 测试通知渠道
      operationId: testNotification
      x-ui-route: /admin/notifications
      security:
      - cookieAuth: []
