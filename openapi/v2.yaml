        '200':
          $ref: '#/components/responses/TrafficPolicyListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Servers
      summary: 创建流量策略
      operationId: createTrafficPolicy
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/TrafficPolicyWrite'
      responses:
        '201':
          $ref: '#/components/responses/TrafficPolicyResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/traffic-policies/{policyId}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    - name: policyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    get:
      tags:
      - Servers
      summary: 流量策略详情
      operationId: getTrafficPolicy
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/TrafficPolicyResponse'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Servers
      summary: 更新流量策略
      operationId: updateTrafficPolicy
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/TrafficPolicyWrite'
      responses:
        '200':
          $ref: '#/components/responses/TrafficPolicyResponse'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Servers
      summary: 删除流量策略
      operationId: deleteTrafficPolicy
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/traffic-policies/{policyId}/usage:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    - name: policyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    get:
      tags:
      - Servers
      summary: 流量策略用量
      operationId: getTrafficPolicyUsage
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/TrafficUsageResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/batch/group:
    post:
      tags:
      - Servers
      summary: 批量更新服务器分组
      operationId: batchUpdateServerGroup
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/BatchServerGroupWrite'
      responses:
        '200':
          $ref: '#/components/responses/ObjectResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/batch/delete:
    post:
      tags:
      - Servers
      summary: 批量删除服务器
      operationId: batchDeleteServers
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/BatchServerDeleteWrite'
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/monitors:
    get:
      tags:
      - Monitors
      summary: 服务监控列表
      operationId: listMonitors
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      responses:
        '200':
          $ref: '#/components/responses/MonitorListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Monitors
      summary: 创建服务监控
      operationId: createMonitor
      x-ui-route: /admin/services
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/MonitorWrite'
      responses:
        '201':
          $ref: '#/components/responses/MonitorResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/monitors/{id}:
