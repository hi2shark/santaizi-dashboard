      summary: 创建告警规则
      operationId: createAlertRule
      x-ui-route: /admin/alert-rules
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/AlertRuleWrite'
      responses:
        '201':
          $ref: '#/components/responses/AlertRuleResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/alert-rules/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Notifications
      summary: 告警规则详情
