    get:
      tags:
      - Monitors
      summary: 服务监控详情
      operationId: getMonitor
      responses:
        '200':
          $ref: '#/components/responses/MonitorResponse'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Monitors
      summary: 更新服务监控
      operationId: updateMonitor
      x-ui-route: /admin/services
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
