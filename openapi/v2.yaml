openapi: 3.0.3
info:
  title: Santaizi HTTP API
  version: 2.0.0
  description: |
    Santaizi Primary 的公开状态和管理接口。浏览器会话使用 Cookie 与 CSRF，
    自动化客户端使用 Bearer Token。Telemetry/Replication 可靠链路仍使用 gRPC。
servers:
- url: /
  description: 当前站点（同源）
- url: https://monitor.example.com
  description: 示例部署地址
tags:
- name: Auth
  description: 管理会话
- name: Public
  description: ServerStatus 公开数据
- name: Servers
  description: 服务器管理
- name: Monitors
  description: 服务监控
- name: Notifications
  description: 通知和告警规则
- name: Network
  description: DDNS 与 NAT
- name: Settings
  description: 站点设置
- name: Telemetry
  description: Collector、Observer 和可靠性
security:
- cookieAuth: []
- bearerAuth: []
paths:
  /api/v2/auth/session:
    get:
      tags:
      - Auth
      summary: 获取当前会话
      description: 返回当前管理员会话。浏览器写操作前需读取 `csrf_token`，并放在 `X-CSRF-Token` 请求头。
      operationId: getSession
      security: []
      responses:
        '200':
          $ref: '#/components/responses/SessionResponse'
  /api/v2/auth/logout:
    post:
      tags:
      - Auth
      summary: 退出登录
      description: 结束 Cookie 会话。使用 Cookie 鉴权时须携带 CSRF Token。
      operationId: logout
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Logged out
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/bootstrap:
    get:
      tags:
      - Public
      summary: 公开站点引导信息
      operationId: getPublicBootstrap
      security: []
      responses:
        '200':
          $ref: '#/components/responses/BootstrapResponse'
  /api/v2/public/view-password/session:
    post:
      tags:
      - Public
      summary: 校验站点访问密码
      description: 站点启用访问密码时，校验密码并建立查看会话。
      operationId: createViewPasswordSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Verified
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/servers:
    get:
      tags:
      - Public
      summary: 公开服务器列表
      description: 公开 ServerStatus 服务器列表；可通过 `x-websocket` 订阅实时状态。
      operationId: listPublicServers
      x-websocket: /ws/v2/public/runtime
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ServerListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/servers/{serverId}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Public
      summary: 公开服务器详情
      operationId: getPublicServer
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/services:
    get:
      tags:
      - Public
      summary: 公开服务监控列表
      operationId: listPublicServices
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ObjectListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/network/{serverId}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Public
      summary: 公开网络延迟历史
      operationId: getPublicNetworkHistory
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ObjectListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/cycle-transfer:
    get:
      tags:
      - Public
      summary: 公开周期流量摘要
      description: 返回已启用流量策略的当前窗口用量；可按 server_id 过滤。不含通知标签等管理字段。
      operationId: listPublicCycleTransfer
      security: []
      parameters:
      - name: server_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/ObjectListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/summary:
    get:
      tags:
      - Settings
      summary: 管理概览摘要
      operationId: getAdminSummary
      responses:
        '200':
          $ref: '#/components/responses/ObjectResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers:
    get:
      tags:
      - Servers
      summary: 服务器列表
      operationId: listServers
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      responses:
        '200':
          $ref: '#/components/responses/ServerListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Servers
      summary: 创建服务器
      operationId: createServer
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerWrite'
      responses:
        '201':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Servers
      summary: 服务器详情
      operationId: getServer
      responses:
        '200':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Servers
      summary: 更新服务器
      operationId: updateServer
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerWrite'
      responses:
        '200':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Servers
      summary: 删除服务器
      operationId: deleteServer
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/availability:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Servers
      summary: 服务器可用性记录
      operationId: listServerAvailability
      x-ui-route: /admin/servers
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ObjectListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/display-index:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    patch:
      tags:
      - Servers
      summary: 更新服务器排序权重
      operationId: updateServerDisplayIndex
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerDisplayIndexWrite'
      responses:
        '200':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/server-groups:
    get:
      tags:
      - Servers
      summary: 服务器分组列表
      operationId: listServerGroups
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/ServerGroupListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/server-groups/rename:
    post:
      tags:
      - Servers
      summary: 重命名服务器分组
      operationId: renameServerGroup
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerGroupRenameWrite'
      responses:
        '200':
          $ref: '#/components/responses/ObjectResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/reset-secret:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    post:
      tags:
      - Servers
      summary: 重置服务器密钥
      operationId: resetServerSecret
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/ServerSecretResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/reset-availability:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    post:
      tags:
      - Servers
      summary: 重置服务器可用性统计
      operationId: resetServerAvailability
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/ObjectResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/credential:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Servers
      summary: 查看服务器密钥
      operationId: getServerCredential
      x-ui-route: /admin/servers
