name: Release

on:
  workflow_dispatch:    # 手动触发
  schedule:
    - cron: '0 0 * * 0'    # 每周日 UTC 00:00 运行

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        goos: [linux]
        goarch: [amd64]

    name: Build artifacts
    runs-on: ubuntu-latest
    container:
      image: goreleaser/goreleaser-cross:v1.23
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0-next    # 指定使用 v0-next 分支
          fetch-depth: 0

      - name: Fix git safe directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status
          git rev-parse --show-toplevel

      - name: Fetch IPInfo GeoIP Database
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          rm pkg/geoip/geoip.db
          wget -qO pkg/geoip/geoip.db https://ipinfo.io/data/free/country.mmdb?token=${IPINFO_TOKEN}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Generate version tag
        id: generate_version_tag
        run: |
          echo "VERSION_TAG=v0-next" >> $GITHUB_ENV
          echo "VERSION_TAG=v0-next" >> $GITHUB_OUTPUT
          hash=$(git rev-parse --short HEAD)
          echo "VERSION_TAG_HASH=v0-next-${hash}" >> $GITHUB_ENV
          echo "VERSION_TAG_HASH=v0-next-${hash}" >> $GITHUB_OUTPUT

      - name: Build
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --single-target --clean --skip=validate
        env:
          GORELEASER_CURRENT_TAG: ${{ env.VERSION_TAG }}
      
      - name: Fix permissions
        run: |
          chmod -R +x ./dist/*/*
          mv ./dist/*/* ./dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up image name
        run: |
          GHCR_IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/nezha-next-dashboard" | tr '[:upper:]' '[:lower:]')
          echo "GHCR_IMAGE_NAME=$GHCR_IMAGE_NAME" >> $GITHUB_OUTPUT
        id: image-name

      - name: Build dasbboard image And Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image-name.outputs.GHCR_IMAGE_NAME }}:latest
            ${{ steps.image-name.outputs.GHCR_IMAGE_NAME }}:v0-next
            ${{ steps.image-name.outputs.GHCR_IMAGE_NAME }}:${{ steps.generate_version_tag.outputs.VERSION_TAG_HASH }}
