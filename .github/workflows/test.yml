name: Run Tests

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu, windows, macos]

    runs-on: ${{ matrix.os }}-latest
    env:
      GO111MODULE: on
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint OpenAPI contract
        run: pnpm lint:openapi

      - name: Generate API clients
        run: pnpm generate:api

      - name: Verify generated API code is current
        shell: bash
        run: git diff --exit-code -- internal/openapiv2/api.gen.go web/packages/api/src/generated

      - name: Type-check and test Vue applications
        run: |
          pnpm typecheck
          pnpm test

      - name: Build embedded Vue applications
        run: pnpm -r --filter './web/apps/**' build

      - name: Install Playwright browser
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser flows
        if: runner.os == 'Linux'
        run: pnpm test:e2e

      - name: Unit test
        run: go test -v ./...

      - name: Build test
        run: go build -v ./...

      - name: Race test critical telemetry paths
        if: runner.os == 'Linux'
        run: go test -race ./cmd/dashboard/controller ./service/telemetry ./service/collector ./service/availability ./service/singleton

      - name: Run Gosec Security Scanner
        if: runner.os == 'Linux'
        uses: securego/gosec@master
        with:
          args: --exclude=G104,G402,G115,G203 -exclude-generated ./...
